<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NP Caro – Cờ Caro Online</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg1:#ffe7f1;--bg2:#e0f4ff;--card:#ffffffee;--tx:#2b2250;--mut:#7a6f9b;--line:#d8cdf5;--cell:#fffdf7;--hl:#ffe27a;--p:#7c4dff;--p2:#ff5fa2;--g:#22c55e;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1740;--bg2:#10253f;--card:#241c3acc;--tx:#f2ecff;--mut:#b4a8d8;--line:#4a3c75;--cell:#2d2547;--hl:#6b5a1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#2a1740;--bg2:#10253f;--card:#241c3acc;--tx:#f2ecff;--mut:#b4a8d8;--line:#4a3c75;--cell:#2d2547;--hl:#6b5a1a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;display:flex;justify-content:center;padding:14px}
main{width:100%;max-width:600px}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 0 10px}
.logo h1{margin:0;font-size:30px;font-weight:800;background:linear-gradient(90deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo svg{width:54px;height:54px;filter:drop-shadow(0 4px 6px #7c4dff55);animation:wob 3s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-6deg) scale(1.05)}}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;backdrop-filter:blur(6px)}
.hero{display:flex;justify-content:center;gap:18px;margin:4px 0 8px}
.hero svg{width:84px;height:84px;animation:hop 1.6s ease-in-out infinite}
.hero svg+svg{animation-delay:.8s}
@keyframes hop{50%{transform:translateY(-10px) rotate(4deg)}}
label{font-weight:700;font-size:15px}
input{font:inherit;font-weight:700;font-size:18px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--cell);color:var(--tx);width:100%;margin:4px 0 12px}
input.code{text-align:center;letter-spacing:8px;font-size:26px;width:160px;margin:0}
button.b{font:inherit;font-weight:800;font-size:17px;padding:10px 18px;border-radius:14px;border:2px solid var(--line);background:var(--cell);color:var(--tx);cursor:pointer;transition:transform .1s}
button.b:active{transform:scale(.95)}
button.b.p{background:linear-gradient(90deg,var(--p),var(--p2));color:#fff;border-color:transparent;box-shadow:0 4px 0 #5b36c9}
button.b:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.mut{color:var(--mut);font-size:14px;text-align:center;margin:10px 0 0}
.sep{text-align:center;color:var(--mut);margin:12px 0;font-weight:700}
#players{display:flex;gap:8px;align-items:stretch;margin-bottom:8px}
.pl{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:6px 10px;min-width:0;transition:.2s}
.pl.on{border-color:var(--g);box-shadow:0 0 0 4px #22c55e44;transform:scale(1.03)}
.pl svg{width:42px;height:42px;flex:none}
.pl span{font-weight:800;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl small{display:block;font-weight:600;color:var(--mut);font-size:12px}
#room{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
#room b{font-size:30px;letter-spacing:6px;color:var(--p)}
#status{text-align:center;font-weight:800;font-size:19px;margin:6px 0 10px;min-height:28px}
#board{display:grid;grid-template-columns:repeat(15,1fr);gap:2px;background:var(--line);border:3px solid var(--line);border-radius:12px;overflow:hidden;width:min(100%,560px);margin:0 auto;aspect-ratio:1}
.c{background:var(--cell);border:0;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;min-width:0}
.c:hover{background:var(--hl)}
.c svg{width:86%;height:86%;pointer-events:none}
.c.last svg{animation:pop .35s ease-out}
.c.last{background:var(--hl)}
.c.win{background:var(--hl);animation:bou .6s ease-in-out infinite alternate}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes bou{to{transform:scale(1.12)}}
#picker{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 14px}
.av{width:54px;height:54px;border-radius:16px;border:3px solid var(--line);background:var(--cell);padding:3px;cursor:pointer;transition:.15s}
.av svg{width:100%;height:100%}
.av.sel{border-color:var(--p);box-shadow:0 0 0 4px #7c4dff44;transform:scale(1.1)}
.statbox{text-align:center;font-weight:700;font-size:14px;color:var(--mut);margin:0 0 12px}
.statbox.big{background:var(--cell);border:2px dashed var(--line);border-radius:14px;padding:8px}
.statbox a{color:var(--p2);cursor:pointer;text-decoration:underline;font-weight:600}
.hr{border:0;border-top:2px dashed var(--line);margin:16px 0 12px}
input.fid{font-size:20px;letter-spacing:4px;width:150px;margin:0;text-transform:uppercase;text-align:center}
button.b.sm{font-size:14px;padding:6px 12px}
#myfid{font-size:20px;letter-spacing:3px;color:var(--p2)}
.fr{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line)}
.fr svg{width:36px;height:36px;flex:none}
.fr .fn{flex:1;min-width:0;text-align:left}
.fr .fn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr .fn small{color:var(--mut);font-weight:600}
.fr .x{border:0;background:none;color:var(--mut);font-size:16px;cursor:pointer}
#tbar{height:22px;border-radius:12px;background:var(--line);overflow:hidden;position:relative;margin:0 auto 10px;width:min(100%,560px)}
#tfill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#22c55e,#facc15);transition:width .25s linear}
#tbar.low #tfill{background:#ef4444}
#tbar.low{animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.03)}}
#tnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#2b2250}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:0;right:0;z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.tt{pointer-events:auto;background:var(--card);border:3px solid var(--p);border-radius:16px;padding:10px 14px;font-weight:700;box-shadow:0 8px 24px #0004;max-width:92vw;backdrop-filter:blur(8px)}
.tt .row{margin-top:8px}
.hide{display:none!important}
.fx{position:fixed;top:-30px;font-size:26px;pointer-events:none;animation:fall 2.6s linear forwards;z-index:50}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
<body>

<main>

  <svg viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c4dff"/><stop offset="1" stop-color="#ff5fa2"/></linearGradient></defs>
  <rect x="3" y="3" width="58" height="58" rx="17" fill="url(#lg)"/>

  <path d="M52 8 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#ffe27a"/></svg>
  <h1>NP Caro</h1>
</div>

<div id="lobby" class="card">
  <div class="hero"><svg id="heroAv" viewBox="0 0 64 64"><use href="#cat"/></svg></div>
  <label>Chọn nhân vật của bạn</label>
  <div id="picker"></div>
  <div id="stats" class="statbox big"></div>
  <label for="name">Tên của bạn</label>
  <input id="name" maxlength="14" placeholder="Ví dụ: Na, Phát…" autocomplete="off">

</div>

</div>

}
const MOVE_MS=60000;
let pid='',fid='',es=null,me=null,g=null,code='',cellEls=[],prevWin='',first=true,myAv=0,friends=[],online={};
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const rnd=(n,a)=>{let s='';for(let i=0;i<n;i++)s+=a[Math.floor(Math.random()*a.length)];return s};
pid=ld('np_pid','')||rnd(12,'abcdefghijklmnopqrstuvwxyz0123456789');sv('np_pid',pid);
fid=ld('np_fid','')||rnd(6,'ABCDEFGHJKLMNPQRSTUVWXYZ23456789');sv('np_fid',fid);
try{friends=JSON.parse(ld('np_friends','[]'))||[]}catch(e){friends=[]}
const icon=i=>'<svg viewBox="0 0 64 64"><use href="#'+AV[i][0]+'"/></svg>';
function setErr(t){$('err').textContent=t||''}
const curName=()=>$('name').value.trim()||'Người chơi';
function myName(){const n=curName();sv('np_name',n);return n}

/* ---- thống kê ---- */
function loadStats(){try{const s=JSON.parse(ld('np_stats',''));if(s&&typeof s.w==='number')return s}catch(e){}return{w:0,l:0,d:0}}
function statsText(){const s=loadStats(),t=s.w+s.l+s.d;return t?'🏆 Thắng '+s.w+' · Thua '+s.l+' · Hòa '+s.d+' · Tỉ lệ thắng '+Math.round(s.w*100/t)+'%':'Chưa có ván nào, vào chơi để ghi điểm nhé!'}
function showStats(){
  const s=loadStats(),has=s.w+s.l+s.d>0;
  $('stats').innerHTML=statsText()+(has?' <a id="rs">Xóa</a>':'');
  $('gstats').textContent=statsText();
  const rs=$('rs');if(rs)rs.onclick=()=>{if(confirm('Xóa toàn bộ thống kê thắng/thua?')){sv('np_stats',JSON.stringify({w:0,l:0,d:0}));showStats()}};
}

/* ---- chọn nhân vật ---- */
function pickAv(i,fromUser){
  myAv=i;sv('np_av',String(i));
  $('heroAv').innerHTML='<use href="#'+AV[i][0]+'"/>';
  document.querySelectorAll('.av').forEach((b,k)=>b.classList.toggle('sel',k===i));
  if(fromUser)sync();
}
AV.forEach((a,i)=>{const b=document.createElement('button');b.className='av';b.title=a[1];b.innerHTML=icon(i);b.onclick=()=>pickAv(i,true);$('picker').appendChild(b)});
{const v=ld('np_name','');if(v)$('name').value=v;const a=parseInt(ld('np_av','0'),10);pickAv(a>=0&&a<AV.length?a:0)}
showStats();
{const h=(location.hash||'').replace('#','');if(/^\d{4}$/.test(h))$('inCode').value=h}
$('name').addEventListener('change',()=>{myName();sync()});

async function api(p,body){
  const r=await fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pid,fid,...body})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||'Có lỗi xảy ra');
  return d;
}

/* ---- bạn bè ---- */
function toast(text,btns,ms){
  const t=document.createElement('div');t.className='tt';
  const p=document.createElement('div');p.textContent=text;t.appendChild(p);
  if(btns){const r=document.createElement('div');r.className='row';
    btns.forEach(([lb,fn,pri])=>{const b=document.createElement('button');b.className='b sm'+(pri?' p':'');b.textContent=lb;b.onclick=()=>{t.remove();fn&&fn()};r.appendChild(b)});t.appendChild(r)}
  $('toast').appendChild(t);setTimeout(()=>t.remove(),ms||(btns?30000:3500));
}
const saveFriends=()=>sv('np_friends',JSON.stringify(friends));
function sync(){api('sync',{name:curName(),av:myAv,friends:friends.map(f=>f.fid)}).catch(()=>{})}
function addFriend(f){
  const x=friends.find(k=>k.fid===f.fid);
  if(x){x.name=f.name||x.name;x.av=f.av}else friends.push({fid:f.fid,name:f.name||'Bạn',av:f.av||0});
  saveFriends();renderFriends();sync();
}
function renderFriends(){
  ['fl','fl2'].forEach(id=>{
    const box=$(id);box.innerHTML='';
    if(!friends.length){const p=document.createElement('p');p.className='mut';p.textContent='Chưa có bạn nào. Gửi mã kết bạn của bạn cho họ, hoặc nhập mã của họ rồi bấm Kết bạn (cả hai cùng đang mở trang).';box.appendChild(p);return}
    [...friends].sort((a,b)=>!!(online[b.fid]&&online[b.fid].online)-!!(online[a.fid]&&online[a.fid].online)).forEach(f=>{
      const on=!!(online[f.fid]&&online[f.fid].online);
      const r=document.createElement('div');r.className='fr';
      r.innerHTML=icon(f.av>=0&&f.av<AV.length?f.av:0);
      const n=document.createElement('div');n.className='fn';
      const b=document.createElement('b');b.textContent=f.name;
      const sm=document.createElement('small');sm.textContent=on?'🟢 Đang online':'⚪ Offline';
      n.append(b,sm);r.appendChild(n);
      const inv=document.createElement('button');inv.className='b sm p';inv.textContent='Mời chơi';inv.disabled=!on;inv.onclick=()=>invite(f.fid);
      const del=document.createElement('button');del.className='x';del.textContent='✕';del.title='Xóa bạn';
      del.onclick=()=>{if(confirm('Xóa '+f.name+' khỏi danh sách bạn bè?')){friends=friends.filter(k=>k.fid!==f.fid);saveFriends();renderFriends();sync()}};
      r.append(inv,del);box.appendChild(r);
    });
  });
}
async function invite(to){
  try{
    if(!code)await create();
    if(!code)return;
    await api('invite',{to,code});
    const f=friends.find(k=>k.fid===to);toast('Đã gửi lời mời cho '+(f?f.name:'bạn')+' 💌');
  }catch(e){toast(e.message)}
}
async function addByFid(){
  const to=$('inFid').value.trim().toUpperCase();
  if(to.length!==6){toast('Mã kết bạn gồm 6 ký tự nha.');return}
  if(to===fid){toast('Đó là mã của chính bạn mà 😄');return}
  try{await api('friend/request',{to,name:curName(),av:myAv});toast('Đã gửi lời kết bạn, chờ bạn đó đồng ý nhé!');$('inFid').value=''}catch(e){toast(e.message)}
}
function onMe(m){
  if(m.type==='hello')sync();
  else if(m.type==='friends'){
    online={};let ch=false;
    m.list.forEach(it=>{online[it.fid]=it;const f=friends.find(k=>k.fid===it.fid);if(f&&it.online&&(f.name!==it.name||f.av!==it.av)){f.name=it.name;f.av=it.av;ch=true}});
    if(ch)saveFriends();renderFriends();
  }
  else if(m.type==='request')toast('💌 '+m.name+' muốn kết bạn với bạn!',[['Đồng ý',async()=>{try{await api('friend/accept',{to:m.fid});addFriend(m)}catch(e){toast(e.message)}},1],['Bỏ qua']]);
  else if(m.type==='added'){addFriend(m);toast('🎉 '+m.name+' đã đồng ý kết bạn!')}
  else if(m.type==='invite')toast('🎮 '+m.name+' mời bạn chơi cờ!',[['Vào chơi',()=>{if(es)leave();$('inCode').value=m.code;join()},1],['Để sau']]);
}
function connectMe(){
  me=new EventSource('/api/me?fid='+fid+'&pid='+pid+'&name='+encodeURIComponent(curName())+'&av='+myAv+'&friends='+friends.map(f=>f.fid).join(','));
  me.onmessage=e=>onMe(JSON.parse(e.data));
}
$('myfid').textContent=fid;
$('bCopyFid').onclick=async()=>{try{await navigator.clipboard.writeText(fid);$('bCopyFid').textContent='✓ Đã chép';setTimeout(()=>$('bCopyFid').textContent='Chép',1500)}catch(e){}};
$('bAddF').onclick=addByFid;
$('inFid').addEventListener('keydown',e=>{if(e.key==='Enter')addByFid()});
$('bFr').onclick=()=>$('fbox').classList.toggle('hide');
renderFriends();connectMe();

/* ---- phòng chơi ---- */
async function create(){
  setErr('');
  try{const d=await api('create',{name:myName(),av:myAv});listen(d.code)}catch(e){setErr(e.message)}
}
async function join(){
  setErr('');
  const c=$('inCode').value.trim();
  if(!/^\d{4}$/.test(c)){setErr('Mã phòng gồm 4 chữ số nha.');return}
  try{await api('join',{code:c,name:myName(),av:myAv});listen(c)}catch(e){setErr(e.message)}
}
function listen(c){
  if(es)es.close();
  code=c;prevWin='';first=true;
  try{location.hash=c}catch(e){}
  $('lobby').classList.add('hide');$('game').classList.remove('hide');$('fbox').classList.add('hide');
  $('code').textContent=c;showStats();
  const b=$('board');b.innerHTML='';cellEls=[];
  for(let i=0;i<N*N;i++){const el=document.createElement('button');el.className='c';el.dataset.v='.';el.onclick=()=>play(i);b.appendChild(el);cellEls.push(el)}
  es=new EventSource('/api/events?code='+c+'&pid='+pid);
  es.onmessage=e=>{g=JSON.parse(e.data);g.dl=Date.now()+g.left;if(first){prevWin=g.winner||'';first=false}render()};
  es.addEventListener('gone',()=>{es.close();alert('Phòng không còn nữa (máy chủ đã khởi động lại). Hãy tạo phòng mới nhé!');leave()});
}
function render(){
  const m=g.you,win=new Set(g.line||[]);
  for(let i=0;i<N*N;i++){
    const ch=g.cells[i],el=cellEls[i],key=ch==='.'?'.':ch+(ch==='X'?g.xa:g.oa);
    if(el.dataset.v!==key){el.dataset.v=key;el.innerHTML=ch==='.'?'':icon(ch==='X'?g.xa:g.oa)}
    el.className='c'+(i===g.last?' last':'')+(win.has(i)?' win':'');
  }
  $('avX').innerHTML='<use href="#'+AV[g.xa][0]+'"/>';$('smX').textContent=AV[g.xa][1];
  $('avO').innerHTML='<use href="#'+AV[g.oa][0]+'"/>';$('smO').textContent=g.hasO?AV[g.oa][1]:'';
  $('nX').textContent=g.xn||'Người chơi';
  $('nO').textContent=g.hasO?(g.on||'Người chơi'):'Đang chờ…';
  const live=g.hasO&&!g.winner;
  $('plX').classList.toggle('on',live&&g.turn==='X');
  $('plO').classList.toggle('on',live&&g.turn==='O');
  const nm=k=>k==='X'?(g.xn||'Người chơi'):(g.on||'Người chơi');
  let t;
  if(!g.hasO)t='⏳ Chờ bạn bè nhập mã '+code+'…';
  else if(g.winner==='D')t='🤝 Hòa rồi!';
  else if(g.winner&&g.reason==='time')t=g.winner===m?'⏰ Đối thủ hết giờ, bạn thắng!':'⏰ Bạn hết giờ rồi, thua mất!';
  else if(g.winner)t=g.winner===m?'🎉 Bạn thắng rồi!':'😜 '+nm(g.winner)+' thắng! Gỡ lại nào!';
  else t=g.turn===m?'👉 Đến lượt bạn nè!':'⌛ Chờ '+nm(g.turn)+' đi…';
  $('status').textContent=t;
  $('bAgain').classList.toggle('hide',!g.winner);
  if(g.winner&&g.winner!==prevWin&&m&&g.hasO){
    const s=loadStats();
    if(g.winner==='D')s.d++;else if(g.winner===m)s.w++;else s.l++;
    sv('np_stats',JSON.stringify(s));showStats();
    if(g.winner===m)confetti();
  }
  prevWin=g.winner||'';
  tick();
}
function tick(){
  const bar=$('tbar');
  if(!g||!g.hasO||g.winner||!g.dl){bar.classList.add('hide');return}
  const left=Math.max(0,g.dl-Date.now());
  bar.classList.remove('hide');bar.classList.toggle('low',left<=10000);
  $('tfill').style.width=(left/MOVE_MS*100)+'%';
  $('tnum').textContent=(g.turn===g.you?'Bạn còn ':'Đối thủ còn ')+Math.ceil(left/1000)+'s';
}
setInterval(tick,250);
function confetti(){
  const e=['🎉','⭐','✨','🎊','💖'];
  for(let i=0;i<26;i++){const s=document.createElement('div');s.className='fx';s.textContent=e[i%5];
    s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*0.8+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),3600)}
}
async function play(i){
  if(!g||!g.hasO||g.winner||g.cells[i]!=='.'||g.turn!==g.you)return;
  try{await api('move',{code,i})}catch(e){$('status').textContent=e.message}
}
async function again(){try{await api('again',{code})}catch(e){}}
function leave(){
  if(es)es.close();es=null;g=null;code='';
  try{history.replaceState(null,'',location.pathname)}catch(e){}
  showStats();$('tbar').classList.add('hide');
  $('game').classList.add('hide');$('lobby').classList.remove('hide');
}
$('bNew').onclick=create;
$('bJoin').onclick=join;
$('inCode').addEventListener('keydown',e=>{if(e.key==='Enter')join()});
$('bAgain').onclick=again;
$('bLeave').onclick=leave;
$('bCopy').onclick=async()=>{
  const txt='Vào chơi NP Caro với mình nè! Mã phòng: '+code+'\n'+location.origin+'/#'+code;
  try{await navigator.clipboard.writeText(txt);$('bCopy').textContent='✓ Đã chép';setTimeout(()=>$('bCopy').textContent='📋 Mời bạn',1500)}catch(e){}
};
</script>
</body>
